[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-builder"
version = "0.1.0"
description = "通用 RAG 知识库建库工具 — 语义切分 + 父文档检索器"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-chroma>=0.2.0",
    "chromadb>=0.5.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "mcp[cli]>=1.0.0",
]

[project.scripts]
rag-build = "rag_builder.cli:main"
rag-mcp = "rag_server.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
